<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penaltis ⚽</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a1628;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #a8d8a8;
    margin-bottom: 18px;
    text-align: center;
  }

  #field {
    background: #2d8a4e;
    border-radius: 12px;
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 300px;
    overflow: hidden;
    border: 2px solid #1f6b3a;
  }

  #field::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12);
    pointer-events: none;
  }

  #field::after {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 100%;
    background: rgba(255,255,255,0.08);
    pointer-events: none;
  }

  #goal {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 270px;
    height: 95px;
    border: 4px solid white;
    border-bottom: none;
    border-radius: 2px 2px 0 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 2px;
    padding: 4px;
  }

  .zone {
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .zone:hover { background: rgba(255,255,255,0.18); }
  .zone.selected { background: rgba(255,255,0,0.2); border-color: yellow; }
  .zone.hit { background: rgba(0,220,80,0.6) !important; }
  .zone.saved { background: rgba(255,160,0,0.6) !important; }

  #ball {
    position: absolute;
    font-size: 30px;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    transition: all 0.5s cubic-bezier(0.2,0.8,0.4,1);
    pointer-events: none;
    line-height: 1;
  }

  #keeper {
    position: absolute;
    font-size: 30px;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    transition: left 0.25s ease-out;
    pointer-events: none;
    line-height: 1;
  }

  #result-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 26px;
    font-weight: 500;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.5);
    padding: 10px 22px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    white-space: nowrap;
  }

  #scoreboard {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    width: 100%;
    max-width: 480px;
  }

  .score-card {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }

  .score-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .score-val {
    font-size: 28px;
    font-weight: 500;
    color: #a8d8a8;
    line-height: 1.2;
  }

  #series-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
  }

  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.2);
    transition: background 0.3s;
  }

  .dot.gol { background: #2d8a4e; border-color: #a8d8a8; }
  .dot.fallo { background: #c0392b; border-color: #e74c3c; }

  #status-bar {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    margin-top: 10px;
    min-height: 20px;
    text-align: center;
    max-width: 480px;
    width: 100%;
  }

  #shoot-btn {
    margin-top: 12px;
    width: 100%;
    max-width: 480px;
    padding: 12px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 10px;
    background: #1f6b3a;
    border: 1.5px solid #2d8a4e;
    color: #a8d8a8;
    letter-spacing: 0.04em;
    transition: background 0.15s, opacity 0.15s;
  }

  #shoot-btn:hover:not(:disabled) { background: #256e40; }
  #shoot-btn:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<h1>⚽ Penaltis</h1>

<div id="field">
  <div id="goal">
    <div class="zone" data-z="0"></div>
    <div class="zone" data-z="1"></div>
    <div class="zone" data-z="2"></div>
    <div class="zone" data-z="3"></div>
    <div class="zone" data-z="4"></div>
    <div class="zone" data-z="5"></div>
  </div>
  <div id="keeper">🧤</div>
  <div id="ball">⚽</div>
  <div id="result-msg"></div>
</div>

<div id="scoreboard">
  <div class="score-card"><div class="score-label">Goles</div><div class="score-val" id="s-goles">0</div></div>
  <div class="score-card"><div class="score-label">Fallos</div><div class="score-val" id="s-fallos">0</div></div>
  <div class="score-card"><div class="score-label">Ronda</div><div class="score-val" id="s-ronda">1/5</div></div>
  <div class="score-card"><div class="score-label">Récord</div><div class="score-val" id="s-record">0</div></div>
</div>

<div id="series-dots"></div>
<div id="status-bar">Elige una zona de la portería para disparar 🎯</div>
<button id="shoot-btn" disabled>— Elige dónde disparar arriba —</button>

<script>
  const zones = document.querySelectorAll('.zone');
  const ball = document.getElementById('ball');
  const keeper = document.getElementById('keeper');
  const resultMsg = document.getElementById('result-msg');
  const statusBar = document.getElementById('status-bar');
  const shootBtn = document.getElementById('shoot-btn');
  const dotsContainer = document.getElementById('series-dots');

  let goles = 0, fallos = 0, round = 1, total = 5;
  let record = parseInt(localStorage.getItem('futbol-record') || '0');
  let selectedZone = null, shooting = false, gameOver = false;

  document.getElementById('s-record').textContent = record;
  renderDots();

  const zonePositions = [
    { left: '28%', top: '22px' }, { left: '50%', top: '22px' }, { left: '72%', top: '22px' },
    { left: '28%', top: '72px' }, { left: '50%', top: '72px' }, { left: '72%', top: '72px' }
  ];

  zones.forEach((z, i) => {
    z.addEventListener('click', () => {
      if (shooting || gameOver) return;
      zones.forEach(z2 => z2.classList.remove('selected'));
      z.classList.add('selected');
      selectedZone = i;
      shootBtn.disabled = false;
      statusBar.textContent = '¡Listo! Pulsa Disparar ⚽';
    });
  });

  shootBtn.addEventListener('click', doShoot);

  function doShoot() {
    if (selectedZone === null || shooting || gameOver) return;
    shooting = true;
    shootBtn.disabled = true;
    zones.forEach(z => z.style.pointerEvents = 'none');

    const keeperChoice = Math.floor(Math.random() * 6);
    const saved = keeperChoice === selectedZone;

    const field = document.getElementById('field');
    const fw = field.offsetWidth;
    const pos = zonePositions[selectedZone];
    const leftPx = (parseFloat(pos.left) / 100) * fw;
    ball.style.bottom = '230px';
    ball.style.left = (leftPx - 15) + 'px';
    ball.style.fontSize = '14px';

    const kpx = (parseFloat(zonePositions[keeperChoice].left) / 100) * fw;
    keeper.style.left = (kpx - 15) + 'px';
    keeper.style.transform = 'none';

    setTimeout(() => {
      zones[selectedZone].classList.remove('selected');
      zones[selectedZone].classList.add(saved ? 'saved' : 'hit');

      if (!saved) {
        goles++;
        showMsg('⚽ ¡GOOOOOL!');
        flashField('#1a6b3e');
      } else {
        fallos++;
        showMsg('🧤 ¡Parada!');
        flashField('#7a1a1a');
      }
      updateScores();
      round++;

      setTimeout(() => {
        resultMsg.style.opacity = '0';
        ball.style.bottom = '28px';
        ball.style.left = '50%';
        ball.style.fontSize = '30px';
        keeper.style.left = '50%';
        keeper.style.transform = 'translateX(-50%)';
        zones[selectedZone].classList.remove('hit', 'saved', 'selected');
        zones.forEach(z => z.style.pointerEvents = 'auto');
        selectedZone = null;
        shooting = false;

        if (round > total) {
          endGame();
        } else {
          document.getElementById('s-ronda').textContent = round + '/5';
          statusBar.textContent = 'Elige una zona de la portería para disparar 🎯';
        }
      }, 1600);
    }, 550);
  }

  function showMsg(txt) {
    resultMsg.textContent = txt;
    resultMsg.style.opacity = '1';
  }

  function flashField(color) {
    const f = document.getElementById('field');
    f.style.background = color;
    setTimeout(() => f.style.background = '#2d8a4e', 300);
  }

  function updateScores() {
    document.getElementById('s-goles').textContent = goles;
    document.getElementById('s-fallos').textContent = fallos;
    renderDots();
  }

  function renderDots() {
    dotsContainer.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      if (i < goles) d.classList.add('gol');
      else if (i < goles + fallos) d.classList.add('fallo');
      dotsContainer.appendChild(d);
    }
  }

  function endGame() {
    gameOver = true;
    if (goles > record) {
      record = goles;
      localStorage.setItem('futbol-record', record);
      document.getElementById('s-record').textContent = record;
    }
    const pct = Math.round((goles / total) * 100);
    const rating = pct === 100 ? '🏆 ¡Perfecto!' : pct >= 60 ? '⭐ ¡Buen trabajo!' : '💪 ¡Sigue entrenando!';
    statusBar.innerHTML = `<strong>${goles}/${total} goles — ${rating}</strong>`;
    shootBtn.textContent = '🔄 Jugar de nuevo';
    shootBtn.disabled = false;
    shootBtn.removeEventListener('click', doShoot);
    shootBtn.addEventListener('click', resetGame);
  }

  function resetGame() {
    goles = 0; fallos = 0; round = 1; gameOver = false; selectedZone = null;
    document.getElementById('s-goles').textContent = 0;
    document.getElementById('s-fallos').textContent = 0;
    document.getElementById('s-ronda').textContent = '1/5';
    statusBar.textContent = 'Elige una zona de la portería para disparar 🎯';
    shootBtn.textContent = '— Elige dónde disparar arriba —';
    shootBtn.disabled = true;
    shootBtn.removeEventListener('click', resetGame);
    shootBtn.addEventListener('click', doShoot);
    renderDots();
    zones.forEach(z => { z.style.pointerEvents = 'auto'; z.className = 'zone'; });
    ball.style.cssText = 'font-size:30px; bottom:28px; left:50%; transform:translateX(-50%); transition:all 0.5s cubic-bezier(0.2,0.8,0.4,1); position:absolute; pointer-events:none; line-height:1;';
    keeper.style.cssText = 'font-size:30px; top:105px; left:50%; transform:translateX(-50%); transition:left 0.25s ease-out; position:absolute; pointer-events:none; line-height:1;';
  }
</script>
</body>
</html>
